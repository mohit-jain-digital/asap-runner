var SHK='',RPD=null,RPL=0;
const GSCRIPT="/**\n * ASAP-Rank <-> Google Sheets\n * Paste this in your spreadsheet: Extensions > Apps Script. Fill the three lines below, then run\n * pushContacts (sheet to ASAP-Rank) or pullContacts (ASAP-Rank to sheet). Add a time trigger to run them on a schedule.\n *\n * Your sheet needs a header row. Columns it understands: name, email, phone, status, tags, source, site\n * Each row needs an email or a phone number. \"site\" must be a site approved on your account (Sites tab).\n */\nconst APP = 'https://YOUR-APP-ADDRESS';\nconst KEY = 'PASTE_YOUR_SHEET_KEY';\n// One line per spreadsheet. id '' means the spreadsheet this script is in. site is used when a row has no site column value.\nconst SHEETS = [\n  { id: '', tab: 'Contacts', site: 'www.example.com' }\n  // , { id: 'OTHER_SPREADSHEET_ID', tab: 'Leads', site: 'shop.example.com' }\n];\n// pullContacts writes everything into this tab of the first spreadsheet above\nconst PULL_TAB = 'ASAP-Rank contacts';\n\nfunction call_(path, method, body) {\n  const r = UrlFetchApp.fetch(APP + path, {\n    method: method, contentType: 'application/json', headers: { Authorization: 'Bearer ' + KEY },\n    payload: body ? JSON.stringify(body) : undefined, muteHttpExceptions: true\n  });\n  let j = {}; try { j = JSON.parse(r.getContentText() || '{}'); } catch (e) {}\n  if (r.getResponseCode() >= 300) throw new Error((j && j.error) || ('HTTP ' + r.getResponseCode()));\n  return j;\n}\n\nfunction pushContacts() {\n  SHEETS.forEach(function (s) {\n    const ss = s.id ? SpreadsheetApp.openById(s.id) : SpreadsheetApp.getActive();\n    const sh = ss.getSheetByName(s.tab);\n    if (!sh) { Logger.log('Tab not found: ' + s.tab); return; }\n    const v = sh.getDataRange().getValues();\n    const head = v.shift().map(function (h) { return String(h).toLowerCase().trim(); });\n    const rows = v.map(function (r) {\n      const o = {}; head.forEach(function (h, i) { o[h] = r[i]; });\n      if (!o.site && s.site) o.site = s.site;\n      return o;\n    }).filter(function (o) { return o.email || o.phone; });\n    for (let i = 0; i < rows.length; i += 200) {\n      const res = call_('/api/sheets/contacts', 'post', { rows: rows.slice(i, i + 200) });\n      Logger.log(s.tab + ': added ' + res.added + ', updated ' + res.updated + ', skipped ' + res.skipped + (res.errors.length ? ' | ' + res.errors.join('; ') : ''));\n    }\n  });\n}\n\nfunction pullContacts() {\n  const first = SHEETS[0], ss = first.id ? SpreadsheetApp.openById(first.id) : SpreadsheetApp.getActive();\n  const sh = ss.getSheetByName(PULL_TAB) || ss.insertSheet(PULL_TAB);\n  const head = ['name', 'email', 'phone', 'status', 'site', 'source', 'tags', 'created', 'updated'];\n  const out = [head];\n  let since = 0;\n  for (let guard = 0; guard < 20; guard++) {\n    const j = call_('/api/sheets/contacts?since=' + since, 'get');\n    j.rows.forEach(function (c) {\n      out.push([c.name, c.email, c.phone, c.status, c.host, c.source, c.tags, new Date(c.created), new Date(c.updated)]);\n    });\n    if (j.rows.length < 500) break;\n    since = j.next;\n  }\n  sh.clearContents();\n  sh.getRange(1, 1, out.length, head.length).setValues(out);\n  Logger.log('Wrote ' + (out.length - 1) + ' contacts to ' + PULL_TAB);\n}\n";

 * ASAP-Rank <-> Google Search Console + Google Analytics 4 (long-tail content ideas)

const APP = 'APPURL';
const KEY = 'KEYVAL';
const SITES = [
  // site: the site as approved in ASAP-Rank. gsc: the property exactly as in Search Console
  // ('sc-domain:example.com' or 'https://www.example.com/'). ga4: the GA4 property number, or '' to skip Analytics.
  { site: 'www.example.com', gsc: 'sc-domain:example.com', ga4: '' }
];
const DAYS = 90;

function post_(path, body) {
  const r = UrlFetchApp.fetch(APP + path, { method: 'post', contentType: 'application/json', headers: { Authorization: 'Bearer ' + KEY }, payload: JSON.stringify(body), muteHttpExceptions: true });
  let j = {}; try { j = JSON.parse(r.getContentText() || '{}'); } catch (e) {}
  if (r.getResponseCode() >= 300) throw new Error((j && j.error) || ('HTTP ' + r.getResponseCode()));
  return j;
}
function google_(url, body) {
  const r = UrlFetchApp.fetch(url, { method: 'post', contentType: 'application/json', headers: { Authorization: 'Bearer ' + ScriptApp.getOAuthToken() }, payload: JSON.stringify(body), muteHttpExceptions: true });
  if (r.getResponseCode() >= 300) throw new Error(url.split('/')[2] + ': ' + r.getContentText().slice(0, 200));
  return JSON.parse(r.getContentText());
}
function syncSearchConsole() {
  SITES.forEach(function (s) {
    if (!s.gsc) return;
    const end = new Date(Date.now() - 3 * 864e5), start = new Date(end.getTime() - DAYS * 864e5);
    const fmt = function (d) { return Utilities.formatDate(d, 'UTC', 'yyyy-MM-dd'); };
    let rows = [];
    for (let off = 0; off < 25000; off += 5000) {
      const j = google_('https://www.googleapis.com/webmasters/v3/sites/' + encodeURIComponent(s.gsc) + '/searchAnalytics/query', { startDate: fmt(start), endDate: fmt(end), dimensions: ['query', 'page'], rowLimit: 5000, startRow: off });
      const got = j.rows || []; rows = rows.concat(got); if (got.length < 5000) break;
    }
    const best = {};
    rows.forEach(function (x) {
      const q = x.keys[0]; if (q.split(' ').length < 3) return;
      if (!best[q] || x.impressions > best[q].i) best[q] = { q: q, p: x.keys[1], c: x.clicks, i: x.impressions, pos: x.position };
    });
    const list = Object.keys(best).map(function (k) { return best[k]; }).sort(function (a, b) { return b.i - a.i; }).slice(0, 3000);
    for (let k = 0; k < list.length; k += 500) post_('/api/seo-sync/gsc', { site: s.site, rows: list.slice(k, k + 500) });
    Logger.log(s.site + ': sent ' + list.length + ' long searches');
  });
}
function syncAnalytics() {
  SITES.forEach(function (s) {
    if (!s.ga4) return;
    const j = google_('https://analyticsdata.googleapis.com/v1beta/properties/' + s.ga4 + ':runReport', { dateRanges: [{ startDate: DAYS + 'daysAgo', endDate: 'yesterday' }], dimensions: [{ name: 'pagePath' }], metrics: [{ name: 'sessions' }, { name: 'totalUsers' }, { name: 'engagementRate' }], orderBys: [{ metric: { metricName: 'sessions' }, desc: true }], limit: 200 });

    post_('/api/seo-sync/ga', { site: s.site, rows: rows });

  });
}

function lvtick(){if(document.hidden||S.tab!='bot'||S.bt!='live'||Date.now()-LAST_ACT>3e5)return;if(LVSID)lvthread();else if(++LVC%3==0)lvload()}
function LIVE(){if(!has('chat'))return LOCKED('chat');
if(LV===null){if(!LVB)lvload();return '<div class="card w"><span class=spin></span>Loading…</div>'}
if(LV.err&&!(LV.sessions||[]).length)return `<div class="card w"><b>Could not load Live chats</b><p class=mu>The server is busy or the free daily limit is used up.</p><p class=mu style="font-size:12px">Reason: ${e(String(LV.err))}</p><button class=pr onclick="LV=null;LVK='';R()">Try again</button></div>`;
const me=String(LV.me||'').toLowerCase(),w=LV.role!='viewer',mg=LV.role=='owner'||LV.role=='manager',on=ONL.length?ONL:(LV.online||[]);
const dots=on.length?on.map(x=>`<span class=bd>● ${e(lvname(x.email))}${x.email==me?' (you)':''}</span>`).join(' '):'<span class=mu>Nobody has the dashboard open</span>';
const bar=`<div class="card w"><b>Team online now</b><div class=row style="flex-wrap:wrap;gap:6px;margin-top:6px">${dots}</div><p class=mu style="font-size:12px;margin:6px 0 0">A visitor is passed to a person only while at least one team member has this dashboard open. Otherwise they get your WhatsApp link, as before.</p></div>`;
if(!LVSID){const L=LV.sessions||[];return bar+`<div class="card w"><b>Chats (${L.length})</b>${L.length?L.map(c=>{const bdg=c.state=='waiting'?'<span class=bd style="background:#fde68a;color:#78350f">Waiting for a person</span>':c.state=='human'?`<span class=bd>With ${e(lvname(c.assignee))}</span>`:'<span class=bd>Assistant</span>';return `<div class=row style="margin:8px 0"><span>${e(c.name||'Anonymous visitor')} ${bdg}<br><small class=mu>${e(c.lastBody||'')} · ${cdate(c.last)}${c.host?' · '+e(c.host):''}</small></span><button data-s="${e(c.sid)}" onclick="lvopen(this.dataset.s)">${c.state=='waiting'?'Open':'View'}</button></div>`}).join(''):'<p class=mu>No chats in the last 2 days.</p>'}</div>`}
const st=LVST||{state:'bot',assignee:''},asg=String(st.assignee||'').toLowerCase(),mine=asg==me,other=st.state=='human'&&asg&&!mine;
const who=st.state=='waiting'?'Waiting for a person':st.state=='human'?'With '+lvname(st.assignee)+(mine?' (you)':''):'With the assistant';
const msgs=LVR.map(m=>m.role=='note'?`<div class=mu style="text-align:center;font-size:12px;margin:6px 0">${e(m.body)}</div>`:`<div style="margin:6px 0;${m.role=='user'?'':'text-align:right'}"><small class=mu>${m.role=='user'?'Visitor':m.role=='bot'?'Assistant':(m.agent?e(lvname(m.agent)):'Team')} · ${cdate(m.t)}</small><div style="display:inline-block;max-width:85%;padding:8px 10px;border-radius:10px;color:#111;background:${m.role=='user'?'#f3f4f6':m.role=='agent'?'#dbeafe':'#ede9fe'};white-space:pre-wrap;text-align:left">${e(m.body)}</div></div>`).join('');
const opts=['<option value="">Back to the queue</option>'].concat((LV.people||[]).map(x=>`<option value="${e(x)}" ${x.toLowerCase()==asg?'selected':''}>${e(lvname(x))}${on.some(o=>o.email==x.toLowerCase())?' ● online':''}</option>`)).join('');
const viewers=LVV.length?`<p class=mu style="font-size:13px;margin:4px 0">Also looking at this chat: ${LVV.map(x=>e(lvname(x))).join(', ')}</p>`:'';
const reply=!w?'<p class=mu style="font-size:13px">View-only login: you can read but not reply.</p>':other?`<p class=mu style="font-size:13px">${e(lvname(st.assignee))} is handling this chat.</p>`:`<div class=row style="gap:8px;flex-wrap:nowrap;margin-top:8px"><input id=lvi maxlength=1000 placeholder="${st.state=='human'?'Reply to the visitor':'Type to take this chat and reply'}" style="margin:0;flex:1" onkeydown="if(event.key=='Enter'&&!event.shiftKey){event.preventDefault();lvsend()}"><button class=pr onclick="lvsend()">Send</button></div>`;
const acts=w?`<div class=row style="margin-top:10px;flex-wrap:wrap;gap:8px">${mine||(other&&!mg)?'':`<button onclick="lvtake(${other?'true':'false'})">${other?'Take over':'Take this chat'}</button>`}<label style="margin:0">Assign to <select id=lvto style="width:auto">${opts}</select></label><button onclick="lvassign()">Assign</button>${st.state=='bot'?'':'<button onclick="lvback()">Hand back to assistant</button>'}</div>`:'';
return bar+`<div class="card w"><button class=lk onclick="lvclose()">← All chats</button><div class=row style="margin-top:6px"><b>${e(LVN||'Visitor')}</b><span class=bd>${e(who)}</span></div>${viewers}<div id=lvml style="height:340px;overflow:auto;padding:4px 2px;border-top:1px solid var(--bd);margin-top:8px">${msgs||'<p class=mu>No messages yet.</p>'}</div>${reply}${acts}</div>`}
var PR0=setInterval(()=>{if(typeof ME!='undefined'&&ME){clearInterval(PR0);pres()}},1500);setInterval(pres,60000);setInterval(lvtick,6000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pres()});
boot();
</script></body></html>
