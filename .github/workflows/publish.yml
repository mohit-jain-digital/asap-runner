name: ASAP-Rank publish
on:
  repository_dispatch: { types: [asap-publish] }   # the app starts this the moment you publish
  push: { branches: [main], paths: ['site/**', 'publish.mjs'] }
  schedule: [ { cron: "43 */6 * * *" } ]
  workflow_dispatch: {}
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: asap-publish, cancel-in-progress: false }
jobs:
  publish:
    environment: { name: github-pages, url: ${{ steps.dep.outputs.page_url }} }
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node publish.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
      - name: Save the files
        run: |
          git config user.name "asap-rank-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "publish $(date -u +%FT%TZ)"; git pull --rebase -q || true; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: dep
        uses: actions/deploy-pages@v4
